<!-- Calculator popup template (یک نمونه مشترک) -->
<div id="miniCalculator" class="shadow border rounded-3 bg-white p-2 d-none" style="position:fixed; z-index:2000; width:220px;">
  <input type="text" id="calcDisplay" class="form-control mb-2 text-end" readonly value="0">
  <div class="d-grid gap-1" style="grid-template-columns: repeat(4, 1fr); display:grid;">
    <button type="button" class="btn btn-light calc-key" data-key="7">7</button>
    <button type="button" class="btn btn-light calc-key" data-key="8">8</button>
    <button type="button" class="btn btn-light calc-key" data-key="9">9</button>
    <button type="button" class="btn btn-outline-danger calc-key" data-key="C">C</button>

    <button type="button" class="btn btn-light calc-key" data-key="4">4</button>
    <button type="button" class="btn btn-light calc-key" data-key="5">5</button>
    <button type="button" class="btn btn-light calc-key" data-key="6">6</button>
    <button type="button" class="btn btn-outline-secondary calc-key" data-key="/">÷</button>

    <button type="button" class="btn btn-light calc-key" data-key="1">1</button>
    <button type="button" class="btn btn-light calc-key" data-key="2">2</button>
    <button type="button" class="btn btn-light calc-key" data-key="3">3</button>
    <button type="button" class="btn btn-outline-secondary calc-key" data-key="*">×</button>

    <button type="button" class="btn btn-light calc-key" data-key="0">0</button>
    <button type="button" class="btn btn-light calc-key" data-key="000">000</button>
    <button type="button" class="btn btn-outline-secondary calc-key" data-key="⌫">⌫</button>
    <button type="button" class="btn btn-outline-secondary calc-key" data-key="-">-</button>

    <button type="button" class="btn btn-success calc-key" data-key="=" style="grid-column: span 3;">=</button>
    <button type="button" class="btn btn-outline-secondary calc-key" data-key="+">+</button>
  </div>
</div>
